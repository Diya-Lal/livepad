name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: livepad
          POSTGRES_PASSWORD: livepad
          POSTGRES_DB: livepad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run db:generate -w apps/server
        env:
          DATABASE_URL: postgresql://livepad:livepad@localhost:5432/livepad_test

      - name: Run migrations
        run: npx prisma migrate deploy --schema apps/server/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://livepad:livepad@localhost:5432/livepad_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://livepad:livepad@localhost:5432/livepad_test
          JWT_ACCESS_SECRET: test-access-secret-that-is-long-enough
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-long-enough
          NODE_ENV: test
